# Lock screen, Catppuccin Mocha
$font = JetBrainsMono Nerd Font

general {
    hide_cursor = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    color = rgb(1e1e2e)
}

input-field {
    monitor =
    size = 22%, 5%
    outline_thickness = 2
    inner_color = rgb(1e1e2e)
    outer_color = rgb(cba6f7)
    check_color = rgb(a6e3a1)
    fail_color = rgb(f38ba8)
    font_color = rgb(cdd6f4)
    fade_on_empty = false
    rounding = 5
    font_family = $font
    placeholder_text = Password
    fail_text = $PAMFAIL$FPRINTFAIL
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgb(cdd6f4)
    font_size = 90
    font_family = $font
    position = 0, 160
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %d"
    color = rgb(a6adc8)
    font_size = 20
    font_family = $font
    position = 0, 70
    halign = center
    valign = center
}
