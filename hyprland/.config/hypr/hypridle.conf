# Close to the hypridle default: dim after 4.5 minutes, lock after 5,
# screen off after 5.5, suspend after 15 on battery, lock before suspend.
# A locked screen always goes off after 30 s without input.
general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

listener {
    timeout = 30                                    # locked (e.g. via power menu): screen off
    condition_cmd = pidof hyprlock
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

# One listener on purpose: two brightnessctl -s running at the same time race
# on creating their state dir after boot, and the loser saves nothing to restore
listener {
    timeout = 270                                   # 4.5 min: dim panel, keyboard backlight off
    on-timeout = brightnessctl -s set 10% ; brightnessctl -sd tpacpi::kbd_backlight set 0
    on-resume = brightnessctl -r ; brightnessctl -rd tpacpi::kbd_backlight
}

# The dimming is only a warning: once locked, restore brightness and keyboard
# backlight (after the lock screen is up, so the bright desktop never shows)
listener {
    timeout = 300                                   # 5 min: lock, then undim
    on-timeout = loginctl lock-session ; sleep 0.5 ; brightnessctl -r ; brightnessctl -rd tpacpi::kbd_backlight
}

listener {
    timeout = 330                                   # 5.5 min: screen off
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

listener {
    timeout = 900                                   # 15 min on battery: suspend
    condition_cmd = grep -qx 0 /sys/class/power_supply/AC/online
    condition_retry = 60                            # unplugged while idle: check again every minute
    on-timeout = systemctl suspend
}
