# Lock before suspend; after 15 minutes of inactivity the screen goes off,
# 10 s later it locks (any input in between brings the desktop back unlocked)
general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

listener {
    timeout = 900                                   # 15 min: screen off
    on-timeout = ~/.local/bin/idle-lock off
    on-resume = ~/.local/bin/idle-lock on
}

listener {
    timeout = 910                                   # 10 s later: lock
    on-timeout = ~/.local/bin/idle-lock lock
}
