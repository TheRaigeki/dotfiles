# Bei einem Kernel-OOM-Kill eines Kindprozesses (z. B. Firefox-Tab)
# nicht die ganze Hyprland-Session stoppen.
#
# Achtung: systemd lädt keinen Drop-in-Ordner, der selbst ein Symlink ist.
# Deshalb mit `stow --no-folding hyprland` verlinken (echter Ordner, Datei als Symlink).
[Service]
OOMPolicy=continue
